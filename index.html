<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Calorie & Macro Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .donut-ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
  .progress-bar { transition: width 0.4s ease; }
</style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Daily Calorie & Macro Planner</h1>
  <p class="text-center text-gray-500 mb-6 text-sm">Track your daily nutrition and reach your goals</p>

  <!-- Goals panel -->
  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="font-bold text-gray-700 mb-4">Daily Goals</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div>
        <label for="goal-cal" class="block text-xs font-medium text-gray-600 mb-1">Calories (kcal)</label>
        <input id="goal-cal" type="number" min="0" step="50" value="2000" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Daily calorie goal">
      </div>
      <div>
        <label for="goal-protein" class="block text-xs font-medium text-gray-600 mb-1">Protein (g)</label>
        <input id="goal-protein" type="number" min="0" step="5" value="150" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Daily protein goal">
      </div>
      <div>
        <label for="goal-carbs" class="block text-xs font-medium text-gray-600 mb-1">Carbs (g)</label>
        <input id="goal-carbs" type="number" min="0" step="5" value="250" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Daily carbs goal">
      </div>
      <div>
        <label for="goal-fat" class="block text-xs font-medium text-gray-600 mb-1">Fat (g)</label>
        <input id="goal-fat" type="number" min="0" step="5" value="65" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Daily fat goal">
      </div>
    </div>
  </div>

  <!-- Add food -->
  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="font-bold text-gray-700 mb-4">Add Food</h2>
    <div class="flex flex-wrap gap-3 mb-3">
      <div class="flex-1 min-w-[200px]">
        <label for="food-search" class="block text-xs font-medium text-gray-600 mb-1">Search Food</label>
        <input id="food-search" type="text" placeholder="e.g. chicken, rice, banana..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" autocomplete="off" aria-label="Search food database" oninput="filterFoods()">
        <div id="food-dropdown" class="hidden absolute z-10 bg-white border border-gray-200 rounded-lg shadow-lg mt-1 max-h-48 overflow-y-auto w-64"></div>
      </div>
      <div class="w-28">
        <label for="food-portion" class="block text-xs font-medium text-gray-600 mb-1">Portion (g)</label>
        <input id="food-portion" type="number" min="1" step="1" value="100" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Food portion in grams">
      </div>
      <div class="flex items-end">
        <button onclick="addFood()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="Add food to log">+ Add</button>
      </div>
    </div>
    <div id="selected-food-info" class="hidden text-xs text-indigo-700 bg-indigo-50 rounded-lg p-2"></div>
  </div>

  <!-- Main content: Chart + Progress + Log -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <!-- Donut chart -->
    <div class="bg-white rounded-xl shadow p-6 flex flex-col items-center">
      <h2 class="font-bold text-gray-700 mb-4 self-start">Today's Macros</h2>
      <svg viewBox="0 0 120 120" class="w-48 h-48" role="img" aria-label="Macro distribution donut chart">
        <circle cx="60" cy="60" r="50" fill="none" stroke="#f3f4f6" stroke-width="18"/>
        <circle id="donut-protein" cx="60" cy="60" r="50" fill="none" stroke="#6366f1" stroke-width="18" class="donut-ring" stroke-dasharray="0 314"/>
        <circle id="donut-carbs" cx="60" cy="60" r="50" fill="none" stroke="#f59e0b" stroke-width="18" class="donut-ring" stroke-dasharray="0 314"/>
        <circle id="donut-fat" cx="60" cy="60" r="50" fill="none" stroke="#10b981" stroke-width="18" class="donut-ring" stroke-dasharray="0 314"/>
        <text x="60" y="57" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" id="donut-cal-text">0</text>
        <text x="60" y="70" text-anchor="middle" font-size="7" fill="#9ca3af">kcal</text>
      </svg>
      <div class="flex flex-wrap gap-4 mt-4 text-xs justify-center">
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span>Protein</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>Carbs</div>
        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>Fat</div>
      </div>

      <!-- Calorie surplus/deficit -->
      <div id="surplus-display" class="mt-4 text-center text-sm font-bold"></div>
    </div>

    <!-- Progress bars -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="font-bold text-gray-700 mb-4">Progress</h2>
      <div class="space-y-5">
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span class="font-medium text-gray-700">Calories</span>
            <span id="prog-cal-label" class="text-gray-500 text-xs"></span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-4" role="progressbar" aria-label="Calorie progress">
            <div id="prog-cal" class="progress-bar h-4 rounded-full bg-indigo-500" style="width:0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span class="font-medium text-gray-700">Protein</span>
            <span id="prog-protein-label" class="text-gray-500 text-xs"></span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-3" role="progressbar" aria-label="Protein progress">
            <div id="prog-protein" class="progress-bar h-3 rounded-full bg-indigo-400" style="width:0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span class="font-medium text-gray-700">Carbs</span>
            <span id="prog-carbs-label" class="text-gray-500 text-xs"></span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-3" role="progressbar" aria-label="Carbs progress">
            <div id="prog-carbs" class="progress-bar h-3 rounded-full bg-amber-400" style="width:0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span class="font-medium text-gray-700">Fat</span>
            <span id="prog-fat-label" class="text-gray-500 text-xs"></span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-3" role="progressbar" aria-label="Fat progress">
            <div id="prog-fat" class="progress-bar h-3 rounded-full bg-emerald-400" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Food log -->
  <div class="bg-white rounded-xl shadow p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-gray-700">Today's Food Log</h2>
      <button onclick="clearLog()" class="text-xs text-red-400 hover:text-red-600 px-2 py-1 rounded hover:bg-red-50 focus:outline-none focus:ring-1 focus:ring-red-300" aria-label="Clear today's food log">Clear All</button>
    </div>
    <div id="food-log" class="space-y-2"></div>
    <p id="no-food" class="text-center text-gray-400 py-6 text-sm">No food logged yet. Add your first meal above.</p>
  </div>
</div>

<script>
// Food database: {name, cal, protein, carbs, fat} per 100g
const FOOD_DB = [
  {name:"Chicken Breast (cooked)", cal:165, protein:31, carbs:0, fat:3.6},
  {name:"Salmon (cooked)", cal:208, protein:20, carbs:0, fat:13},
  {name:"Tuna (canned in water)", cal:116, protein:26, carbs:0, fat:1},
  {name:"Egg (whole)", cal:155, protein:13, carbs:1.1, fat:11},
  {name:"Greek Yogurt (plain)", cal:59, protein:10, carbs:3.6, fat:0.4},
  {name:"Milk (whole)", cal:61, protein:3.2, carbs:4.8, fat:3.3},
  {name:"Cheddar Cheese", cal:403, protein:25, carbs:1.3, fat:33},
  {name:"Cottage Cheese", cal:98, protein:11, carbs:3.4, fat:4.3},
  {name:"Tofu (firm)", cal:76, protein:8, carbs:1.9, fat:4.8},
  {name:"Beef (ground, 90% lean)", cal:215, protein:26, carbs:0, fat:12},
  {name:"White Rice (cooked)", cal:130, protein:2.7, carbs:28, fat:0.3},
  {name:"Brown Rice (cooked)", cal:112, protein:2.3, carbs:24, fat:0.8},
  {name:"Oats (dry)", cal:389, protein:17, carbs:66, fat:7},
  {name:"White Bread", cal:265, protein:9, carbs:49, fat:3.2},
  {name:"Whole Wheat Bread", cal:247, protein:13, carbs:41, fat:4.2},
  {name:"Pasta (cooked)", cal:131, protein:5, carbs:25, fat:1.1},
  {name:"Potato (baked)", cal:93, protein:2.5, carbs:21, fat:0.1},
  {name:"Sweet Potato", cal:86, protein:1.6, carbs:20, fat:0.1},
  {name:"Banana", cal:89, protein:1.1, carbs:23, fat:0.3},
  {name:"Apple", cal:52, protein:0.3, carbs:14, fat:0.2},
  {name:"Orange", cal:47, protein:0.9, carbs:12, fat:0.1},
  {name:"Strawberries", cal:32, protein:0.7, carbs:7.7, fat:0.3},
  {name:"Blueberries", cal:57, protein:0.7, carbs:14, fat:0.3},
  {name:"Avocado", cal:160, protein:2, carbs:9, fat:15},
  {name:"Broccoli", cal:34, protein:2.8, carbs:7, fat:0.4},
  {name:"Spinach", cal:23, protein:2.9, carbs:3.6, fat:0.4},
  {name:"Carrots", cal:41, protein:0.9, carbs:10, fat:0.2},
  {name:"Tomato", cal:18, protein:0.9, carbs:3.9, fat:0.2},
  {name:"Cucumber", cal:16, protein:0.7, carbs:3.6, fat:0.1},
  {name:"Bell Pepper", cal:31, protein:1, carbs:6, fat:0.3},
  {name:"Almonds", cal:579, protein:21, carbs:22, fat:50},
  {name:"Walnuts", cal:654, protein:15, carbs:14, fat:65},
  {name:"Peanut Butter", cal:588, protein:25, carbs:20, fat:50},
  {name:"Olive Oil", cal:884, protein:0, carbs:0, fat:100},
  {name:"Butter", cal:717, protein:0.9, carbs:0.1, fat:81},
  {name:"Lentils (cooked)", cal:116, protein:9, carbs:20, fat:0.4},
  {name:"Black Beans (cooked)", cal:132, protein:8.9, carbs:24, fat:0.5},
  {name:"Chickpeas (cooked)", cal:164, protein:8.9, carbs:27, fat:2.6},
  {name:"Quinoa (cooked)", cal:120, protein:4.4, carbs:22, fat:1.9},
  {name:"Edamame (shelled)", cal:122, protein:11, carbs:10, fat:5.2},
  {name:"Orange Juice", cal:45, protein:0.7, carbs:10, fat:0.2},
  {name:"Coca-Cola", cal:42, protein:0, carbs:11, fat:0},
  {name:"Beer (regular)", cal:43, protein:0.5, carbs:3.6, fat:0},
  {name:"White Wine", cal:82, protein:0.1, carbs:2.6, fat:0},
  {name:"Protein Powder (whey)", cal:400, protein:80, carbs:10, fat:5},
  {name:"Dark Chocolate (70%+)", cal:598, protein:7.8, carbs:46, fat:43},
  {name:"Honey", cal:304, protein:0.3, carbs:82, fat:0},
  {name:"Mayo", cal:680, protein:0.9, carbs:0.6, fat:75},
  {name:"Ketchup", cal:101, protein:1.2, carbs:25, fat:0.1},
  {name:"Pizza (cheese)", cal:266, protein:11, carbs:33, fat:10},
  {name:"Bacon (cooked)", cal:541, protein:37, carbs:1.4, fat:42},
  {name:"Turkey Breast (cooked)", cal:135, protein:30, carbs:0, fat:1},
  {name:"Shrimp (cooked)", cal:99, protein:24, carbs:0, fat:0.3},
  {name:"Corn", cal:86, protein:3.3, carbs:19, fat:1.4},
  {name:"Mushroom", cal:22, protein:3.1, carbs:3.3, fat:0.3},
];

let selectedFood = null;
let foodLog = [];
let goals = { cal: 2000, protein: 150, carbs: 250, fat: 65 };

function loadStorage() {
  try {
    const lg = localStorage.getItem('macro_log');
    if (lg) foodLog = JSON.parse(lg);
    const gl = localStorage.getItem('macro_goals');
    if (gl) {
      const g = JSON.parse(gl);
      goals = g;
      document.getElementById('goal-cal').value = g.cal;
      document.getElementById('goal-protein').value = g.protein;
      document.getElementById('goal-carbs').value = g.carbs;
      document.getElementById('goal-fat').value = g.fat;
    }
  } catch(e) {}
}

function saveStorage() {
  try {
    localStorage.setItem('macro_log', JSON.stringify(foodLog));
    localStorage.setItem('macro_goals', JSON.stringify(goals));
  } catch(e) {}
}

function getGoals() {
  return {
    cal: parseFloat(document.getElementById('goal-cal').value) || 2000,
    protein: parseFloat(document.getElementById('goal-protein').value) || 150,
    carbs: parseFloat(document.getElementById('goal-carbs').value) || 250,
    fat: parseFloat(document.getElementById('goal-fat').value) || 65,
  };
}

document.querySelectorAll('#goal-cal,#goal-protein,#goal-carbs,#goal-fat').forEach(el => {
  el.addEventListener('input', () => { goals = getGoals(); saveStorage(); render(); });
});

function filterFoods() {
  const query = document.getElementById('food-search').value.toLowerCase().trim();
  const dd = document.getElementById('food-dropdown');
  if (!query) { dd.classList.add('hidden'); return; }
  const matches = FOOD_DB.filter(f => f.name.toLowerCase().includes(query)).slice(0, 10);
  dd.innerHTML = '';
  if (matches.length === 0) { dd.classList.add('hidden'); return; }
  matches.forEach(f => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 focus:bg-indigo-50 focus:outline-none';
    item.textContent = f.name;
    item.setAttribute('aria-label', 'Select ' + f.name);
    item.onclick = () => selectFood(f);
    dd.appendChild(item);
  });
  dd.classList.remove('hidden');
}

function selectFood(f) {
  selectedFood = f;
  document.getElementById('food-search').value = f.name;
  document.getElementById('food-dropdown').classList.add('hidden');
  const info = document.getElementById('selected-food-info');
  info.textContent = 'Per 100g: ' + f.cal + ' kcal | Protein ' + f.protein + 'g | Carbs ' + f.carbs + 'g | Fat ' + f.fat + 'g';
  info.classList.remove('hidden');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#food-search') && !e.target.closest('#food-dropdown')) {
    document.getElementById('food-dropdown').classList.add('hidden');
  }
});

function addFood() {
  if (!selectedFood) { document.getElementById('food-search').focus(); return; }
  const portion = parseFloat(document.getElementById('food-portion').value);
  if (isNaN(portion) || portion <= 0) { document.getElementById('food-portion').focus(); return; }
  const factor = portion / 100;
  const entry = {
    id: Date.now(),
    name: selectedFood.name,
    portion,
    cal: selectedFood.cal * factor,
    protein: selectedFood.protein * factor,
    carbs: selectedFood.carbs * factor,
    fat: selectedFood.fat * factor,
  };
  foodLog.push(entry);
  saveStorage();
  render();
  selectedFood = null;
  document.getElementById('food-search').value = '';
  document.getElementById('food-portion').value = '100';
  document.getElementById('selected-food-info').classList.add('hidden');
}

function removeFood(id) {
  foodLog = foodLog.filter(f => f.id !== id);
  saveStorage();
  render();
}

function clearLog() {
  if (!confirm('Clear all food entries for today?')) return;
  foodLog = [];
  saveStorage();
  render();
}

function render() {
  const g = getGoals();
  const totals = foodLog.reduce((acc, f) => {
    acc.cal += f.cal; acc.protein += f.protein; acc.carbs += f.carbs; acc.fat += f.fat;
    return acc;
  }, { cal: 0, protein: 0, carbs: 0, fat: 0 });

  // Surplus/deficit
  const diff = totals.cal - g.cal;
  const sdEl = document.getElementById('surplus-display');
  if (foodLog.length === 0) {
    sdEl.textContent = '';
  } else if (diff > 0) {
    sdEl.textContent = '+' + Math.round(diff) + ' kcal surplus';
    sdEl.className = 'mt-4 text-center text-sm font-bold text-red-500';
  } else {
    sdEl.textContent = Math.abs(Math.round(diff)) + ' kcal deficit';
    sdEl.className = 'mt-4 text-center text-sm font-bold text-green-600';
  }

  // Progress bars
  function setBar(id, labelId, val, goal, unit, color) {
    const pct = goal > 0 ? Math.min(100, (val / goal) * 100) : 0;
    const bar = document.getElementById(id);
    bar.style.width = pct + '%';
    if (pct >= 100) bar.classList.add('bg-red-400'); else bar.classList.remove('bg-red-400');
    document.getElementById(labelId).textContent =
      Math.round(val) + unit + ' / ' + Math.round(goal) + unit + ' (' + Math.round(pct) + '%)';
  }
  setBar('prog-cal', 'prog-cal-label', totals.cal, g.cal, ' kcal', 'indigo');
  setBar('prog-protein', 'prog-protein-label', totals.protein, g.protein, 'g', 'indigo');
  setBar('prog-carbs', 'prog-carbs-label', totals.carbs, g.carbs, 'g', 'amber');
  setBar('prog-fat', 'prog-fat-label', totals.fat, g.fat, 'g', 'emerald');

  // Donut chart
  const circumference = 2 * Math.PI * 50; // ~314
  const totalMacroKcal = totals.protein * 4 + totals.carbs * 4 + totals.fat * 9;
  const proteinPct = totalMacroKcal > 0 ? (totals.protein * 4 / totalMacroKcal) : 0;
  const carbsPct = totalMacroKcal > 0 ? (totals.carbs * 4 / totalMacroKcal) : 0;
  const fatPct = totalMacroKcal > 0 ? (totals.fat * 9 / totalMacroKcal) : 0;

  const pLen = proteinPct * circumference;
  const cLen = carbsPct * circumference;
  const fLen = fatPct * circumference;

  const pOff = 0;
  const cOff = pLen;
  const fOff = pLen + cLen;

  function setDonut(id, len, total, offset) {
    const el = document.getElementById(id);
    el.setAttribute('stroke-dasharray', len + ' ' + (circumference - len));
    el.setAttribute('stroke-dashoffset', -offset);
  }
  setDonut('donut-protein', pLen, circumference, pOff);
  setDonut('donut-carbs', cLen, circumference, cOff);
  setDonut('donut-fat', fLen, circumference, fOff);
  document.getElementById('donut-cal-text').textContent = Math.round(totals.cal);

  // Food log
  const logEl = document.getElementById('food-log');
  logEl.innerHTML = '';
  const noFood = document.getElementById('no-food');
  if (foodLog.length === 0) {
    noFood.style.display = '';
  } else {
    noFood.style.display = 'none';
    foodLog.forEach(f => {
      const row = document.createElement('div');
      row.className = 'flex flex-wrap items-center gap-2 bg-gray-50 rounded-lg p-3 text-sm';

      const name = document.createElement('div');
      name.className = 'flex-1 font-medium text-gray-700 min-w-[120px]';
      name.textContent = f.name + ' (' + f.portion + 'g)';

      const macros = document.createElement('div');
      macros.className = 'flex gap-3 text-xs text-gray-500';
      const items = [
        [Math.round(f.cal) + ' kcal', 'text-indigo-600 font-semibold'],
        ['P:' + f.protein.toFixed(1) + 'g', ''],
        ['C:' + f.carbs.toFixed(1) + 'g', ''],
        ['F:' + f.fat.toFixed(1) + 'g', ''],
      ];
      items.forEach(([txt, cls]) => {
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = txt;
        macros.appendChild(span);
      });

      const del = document.createElement('button');
      del.className = 'text-red-400 hover:text-red-600 text-xs px-2 py-1 rounded hover:bg-red-50 focus:outline-none focus:ring-1 focus:ring-red-300';
      del.textContent = 'Remove';
      del.setAttribute('aria-label', 'Remove ' + f.name);
      del.onclick = () => removeFood(f.id);

      row.appendChild(name);
      row.appendChild(macros);
      row.appendChild(del);
      logEl.appendChild(row);
    });
  }
}

loadStorage();
render();
</script>
</body>
</html>
